function niceTicks(lo, hi, n) {
  if (!(isFinite(lo) && isFinite(hi))) return [];
  if (lo === hi) { lo -= Math.abs(lo) * .1 || 1; hi += Math.abs(hi) * .1 || 1; }
  const step0 = (hi - lo) / Math.max(1, n); const p = Math.pow(10, Math.floor(Math.log10(step0)));
  const e = step0 / p; const step = (e >= 5 ? 10 : e >= 2 ? 5 : e >= 1 ? 2 : 1) * p;
  const t = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) t.push(+v.toPrecision(12));
  return t;
}
function logTicks(lo, hi) { const t = []; for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
  for (const m of [1, 2, 5]) { const v = m * Math.pow(10, e); if (v >= lo * 0.999 && v <= hi * 1.001) t.push(v); } return t; }
function fmt(v) { if (v == null || !isFinite(v)) return '–'; const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return v.toExponential(2);
  return +v.toPrecision(4) + ''; }

// ---------- 차트 ----------
const tip = $('tip');
function chart(card, rows, metric, sdims, cmap, yDomain, opts) {
  const W = Math.max(260, card.clientWidth - 20), H = opts.H || (opts.small ? 190 : 340);
  const zkey = opts.key, Z = zkey && S.zoom[zkey];
  const groups = new Map();
  for (const i of rows) { const y = C[metric][i]; if (y == null) continue; if (S.logY && !(y > 0)) continue;
    const k = seriesKey(i, sdims); if (S.hidden.has(k)) continue;
    if (!groups.has(k)) groups.set(k, []); groups.get(k).push([xOf(i), y, i]); }
  const pts = [...groups.values()].flat();
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  if (!pts.length) { svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="${css('--text-muted')}" font-size="12">표시할 값 없음</text>`; card.appendChild(svg); return; }
  groups.forEach(g => g.sort((a, b) => a[0] - b[0]));
  // 직접 라벨은 모든 선이 같은 x 에서 끝날 때만 (끝이 다르면 라벨이 엉뚱한 선 옆에 붙는다)
  const ends = new Set([...groups.values()].map(g => g[g.length - 1][0]));
  const direct = !opts.small && !Z && groups.size <= 4 && groups.size >= 2 && ends.size === 1;
  const M = { l: 56, r: direct ? 150 : 14, t: 10, b: 34 };
  const xs = pts.map(p => p[0]); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 1; x1 += 1; }
  let [y0, y1] = yDomain || [Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[1]))];
  const L = S.logY;
  const ty = v => L ? Math.log10(v) : v;
  let a = ty(y0), b = ty(y1); if (a === b) { a -= 1; b += 1; } const pad = (b - a) * .06; a -= pad; b += pad;
  if (Z) { [x0, x1] = Z.x; [a, b] = Z.y; }
  const X = v => M.l + (v - x0) / (x1 - x0) * (W - M.l - M.r);
  const Y = v => H - M.b - (ty(v) - a) / (b - a) * (H - M.t - M.b);
  const g = [];
  const gridC = css('--grid'), axisC = css('--axis'), muted = css('--text-muted');
  const yt = L ? logTicks(Math.pow(10, a), Math.pow(10, b)) : niceTicks(a, b, opts.small ? 4 : 6);
  for (const v of yt) { const y = Y(v); if (y < M.t - 1 || y > H - M.b + 1) continue;
    g.push(`<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="${gridC}" stroke-width="1"/>`,
      `<text x="${M.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${muted}">${fmt(v)}</text>`); }
  let xt = niceTicks(x0, x1, Math.max(2, Math.floor((W - M.l - M.r) / 90)));
  if (xIsCat()) { // 범주 X: 보이는 범주를 모두, 자리가 모자라면 고르게 솎아서
    const lo = Math.max(0, Math.ceil(x0)), hi = Math.floor(x1), n = hi - lo + 1;
    const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - M.l - M.r) / 70))));
    xt = []; for (let v = lo; v <= hi; v += step) xt.push(v); }
  for (const v of xt) { const x = X(v);
    g.push(`<line x1="${x}" x2="${x}" y1="${H - M.b}" y2="${H - M.b + 4}" stroke="${axisC}"/>`,
      `<text x="${x}" y="${H - M.b + 17}" text-anchor="middle" font-size="11" fill="${muted}">${esc(xFmt(v))}</text>`); }
  g.push(`<line x1="${M.l}" x2="${W - M.r}" y1="${H - M.b}" y2="${H - M.b}" stroke="${axisC}"/>`);
  if (!opts.small) g.push(`<text x="${(M.l + W - M.r) / 2}" y="${H - 2}" text-anchor="middle" font-size="11" fill="${muted}">${esc(xLabel(S.x))}</text>`);
  // 기타(접힌 시리즈) 먼저, 색 있는 시리즈 나중에 그려 위로 오게
  const ordered = [...groups.keys()].sort((p, q) => (cmap.color(p) ? 1 : 0) - (cmap.color(q) ? 1 : 0));
  const surf = css('--surface-1');
  const nvis = Z ? pts.filter(p => p[0] >= x0 && p[0] <= x1).length : pts.length;
  const dense = nvis / Math.max(1, groups.size) > 60;
  const cid = 'cp' + (++clipSeq);   // 확대 시 축 밖으로 나가는 선·점을 자른다
  g.push(`<clipPath id="${cid}"><rect x="${M.l}" y="${M.t - 4}" width="${W - M.l - M.r}" height="${H - M.t - M.b + 8}"/></clipPath><g clip-path="url(#${cid})">`);
  for (const k of ordered) {
    const pg = groups.get(k); const col = cmap.color(k) || 'var(--other)'; const w = cmap.color(k) ? 2 : 1.2;
    const da = cmap.dash(k), hol = cmap.hollow(k);
    g.push(`<g class="ser" data-s="${cmap.rank(k)}">`);
    if (pg.length > 1) g.push(`<polyline fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"${da ? ` stroke-dasharray="${da}"` : ''} points="${pg.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/>`);
    if (!dense || pg.length === 1) for (const p of pg) g.push(hol
      ? `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${opts.small ? 2.5 : 3.2}" fill="${surf}" stroke="${col}" stroke-width="1.6"/>`
      : `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${opts.small ? 2.5 : 3.5}" fill="${col}" stroke="${surf}" stroke-width="1.5"/>`);
    g.push('</g>');
  }
  g.push('</g>');
  if (direct) { // 선 끝 직접 라벨 (겹침 회피)
    const labs = [...groups.entries()].filter(([k]) => cmap.color(k)).map(([k, pg]) => ({ k, y: Y(pg[pg.length - 1][1]), x: X(pg[pg.length - 1][0]) }));
    labs.sort((p, q) => p.y - q.y); for (let j = 1; j < labs.length; j++) if (labs[j].y - labs[j - 1].y < 13) labs[j].y = labs[j - 1].y + 13;
    for (const l of labs) g.push(`<text x="${W - M.r + 8}" y="${l.y + 4}" font-size="11" fill="${css('--text-secondary')}">${esc(l.k.length > 24 ? l.k.slice(0, 23) + '…' : l.k)}</text>`);
  }
  g.push(`<line id="ch" x1="0" x2="0" y1="${M.t}" y2="${H - M.b}" stroke="${axisC}" stroke-dasharray="3 3" visibility="hidden"/>`,
    `<g id="hl"></g><rect x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}" fill="transparent"/>`,
    `<rect id="sel" fill="var(--accent)" fill-opacity=".12" stroke="var(--accent)" stroke-width="1" visibility="hidden"/>`);
  svg.innerHTML = g.join('');
  card.appendChild(svg);
  // 드래그 확대: 가로로만 끌면 X 범위만(Y 는 그 구간 값에 맞춤), 상자로 끌면 X·Y 모두. 더블클릭 = 원래대로.
  const toSvg = ev => { const r = svg.getBoundingClientRect(); return [(ev.clientX - r.left) * W / r.width, (ev.clientY - r.top) * H / r.height]; };
  const inPlot = ([px, py]) => px >= M.l && px <= W - M.r && py >= M.t && py <= H - M.b;
  const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const selR = svg.querySelector('#sel'); let drag = null;
  if (zkey) {
    svg.classList.add('zoomable');
    const move = ev => { if (!drag) return; const [px, py] = toSvg(ev);
      const qx = cl(px, M.l, W - M.r), qy = cl(py, M.t, H - M.b); const flat = Math.abs(qy - drag[1]) < 12;
      selR.setAttribute('x', Math.min(drag[0], qx)); selR.setAttribute('width', Math.abs(qx - drag[0]));
      selR.setAttribute('y', flat ? M.t : Math.min(drag[1], qy)); selR.setAttribute('height', flat ? H - M.t - M.b : Math.abs(qy - drag[1]));
      selR.setAttribute('visibility', 'visible'); tip.style.display = 'none'; };
    const up = ev => { if (!drag) return; const [px, py] = toSvg(ev); const d0 = drag; drag = null;
      removeEventListener('mousemove', move); removeEventListener('mouseup', up); selR.setAttribute('visibility', 'hidden');
      const qx = cl(px, M.l, W - M.r), qy = cl(py, M.t, H - M.b);
      if (Math.abs(qx - d0[0]) < 6) return;
      const ix = v => x0 + (v - M.l) / (W - M.l - M.r) * (x1 - x0);
      const iy = v => a + (H - M.b - v) / (H - M.t - M.b) * (b - a);
      const nx = [ix(Math.min(d0[0], qx)), ix(Math.max(d0[0], qx))];
      let ny;
      if (Math.abs(qy - d0[1]) < 12) {   // X 만: 그 구간 안의 값으로 Y 를 맞춘다
        const ys = pts.filter(p => p[0] >= nx[0] && p[0] <= nx[1]).map(p => ty(p[1]));
        if (!ys.length) return;
        let lo = Math.min(...ys), hi = Math.max(...ys); if (lo === hi) { lo -= Math.abs(lo) * .05 || 1; hi += Math.abs(hi) * .05 || 1; }
        const pd = (hi - lo) * .08; ny = [lo - pd, hi + pd];
      } else ny = [iy(Math.max(d0[1], qy)), iy(Math.min(d0[1], qy))];
      S.zoom[zkey] = { x: nx, y: ny }; render(); };
    svg.addEventListener('mousedown', ev => { if (ev.button !== 0) return; const p = toSvg(ev); if (!inPlot(p)) return;
      drag = p; ev.preventDefault(); addEventListener('mousemove', move); addEventListener('mouseup', up); });
    svg.addEventListener('dblclick', () => { if (S.zoom[zkey]) { delete S.zoom[zkey]; render(); } });
  }
  // 호버: 가장 가까운 x 로 스냅, 그 x 의 모든 시리즈 값을 표시
  const uxs = [...new Set(xs)].filter(u => u >= x0 && u <= x1).sort((p, q) => p - q);
  const ch = svg.querySelector('#ch'), hl = svg.querySelector('#hl');
  svg.addEventListener('mousemove', ev => {
    if (drag || !uxs.length) return;
    const r = svg.getBoundingClientRect(); const mx = (ev.clientX - r.left) * W / r.width;
    const xv = x0 + (mx - M.l) / (W - M.l - M.r) * (x1 - x0);
    let best = uxs[0]; for (const u of uxs) if (Math.abs(u - xv) < Math.abs(best - xv)) best = u;
    const px = X(best); ch.setAttribute('x1', px); ch.setAttribute('x2', px); ch.setAttribute('visibility', 'visible');
    const hits = [];
    for (const k of ordered) for (const p of groups.get(k)) if (p[0] === best) hits.push([k, p]);
    hits.sort((p, q) => q[1][1] - p[1][1]);
    const my = (ev.clientY - r.top) * H / r.height;
    let near = null, nd = 24;   // 마우스 세로 위치에서 24px 안의 가장 가까운 선
    for (const [k, p] of hits) { const d = Math.abs(Y(p[1]) - my); if (d < nd) { nd = d; near = k; } }
    setHL(near == null ? null : cmap.rank(near));
    hl.innerHTML = hits.map(([k, p]) => `<circle cx="${px}" cy="${Y(p[1])}" r="${k === near ? 6 : 4.5}" fill="${cmap.color(k) || 'var(--other)'}" stroke="${surf}" stroke-width="2"/>`).join('');
    let show = hits.slice(0, 14);
    if (near != null && !show.some(([k]) => k === near)) show = show.slice(0, 13).concat(hits.filter(([k]) => k === near));
    let extra = '';
    if (hits.length === 1 && D.info.length) extra = D.info.map(c => `${esc(c)}: ${esc(C[c][hits[0][1][2]])}`).join('<br>');
    tip.innerHTML = `<div class="hd">${esc(xLabel(S.x))} = ${esc(xFmt(best))} · ${esc(metric)}</div>` +
      show.map(([k, p]) => `<div class="row${k === near ? ' hl' : ''}">${swatch(cmap, k)}${cmap.rank(k) + 1}. ${esc(k)}<b>${fmt(p[1])}</b></div>`).join('') +
      (hits.length > show.length ? `<div class="ex">외 ${hits.length - show.length}개</div>` : '') +
      (extra ? `<div class="ex">${extra}</div>` : '');
    tip.style.display = 'block';
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let lx = ev.clientX + 14, ly = ev.clientY + 14;
    if (lx + tw > innerWidth - 8) lx = ev.clientX - tw - 14; if (ly + th > innerHeight - 8) ly = innerHeight - th - 8;
    tip.style.left = lx + 'px'; tip.style.top = Math.max(8, ly) + 'px';
  });
  svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; ch.setAttribute('visibility', 'hidden'); hl.innerHTML = ''; setHL(null); });
}

let clipSeq = 0;
const zoomKey = (metric, f) => `${S.x}|${metric}|${f == null ? '' : S.facet + '=' + f}|${S.logY ? 'log' : 'lin'}`;

// 카드 머리: 제목 + (확대 중이면) 원래대로 + 크게 보기 버튼
function cardHead(card, title, sub, metric, f) {
  const key = zoomKey(metric, f);
  card.innerHTML = `<div class="hdr"><div><h3>${esc(title)}</h3>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div>` +
    (S.zoom[key] ? `<button class="ibtn" type="button" data-a="reset" title="확대 해제 (더블클릭과 같음)">↺ 원래대로</button>` : '') +
    `<button class="ibtn" type="button" data-a="big" title="크게 보기">⤢ 크게</button></div>`;
  card.querySelector('[data-a=big]').onclick = () => { S.expanded = { metric, f }; render(); };
  const rs = card.querySelector('[data-a=reset]'); if (rs) rs.onclick = () => { delete S.zoom[key]; render(); };
  return key;
}

// 크게 보기: 화면을 거의 채우는 창에 같은 그래프를 다시 그린다 (확대 상태는 작은 그래프와 공유)
function drawOverlay(rows, sdims, cmap) {
  document.querySelectorAll('.ovl').forEach(o => o.remove());
  if (!S.expanded) return;
  const { metric, f } = S.expanded;
  const ov = document.createElement('div'); ov.className = 'ovl';
  const card = document.createElement('div'); card.className = 'card'; ov.appendChild(card); document.body.appendChild(ov);
  const key = cardHead(card, `${metric}${f != null ? ` — ${S.facet} = ${f}` : ''}`,
    '드래그: 확대 (가로로만 끌면 X 범위, 상자로 끌면 X·Y) · 더블클릭: 원래대로 · Esc: 닫기', metric, f);
  const big = card.querySelector('[data-a=big]'); big.textContent = '✕ 닫기'; big.title = '닫기 (Esc)';
  big.onclick = () => { S.expanded = null; render(); };
  const lg = $('legend').cloneNode(true); lg.removeAttribute('id'); lg.querySelectorAll('.it').forEach(i => i.style.cursor = 'default');
  card.appendChild(lg);
  ov.onclick = e => { if (e.target === ov) { S.expanded = null; render(); } };
  const fr = f == null ? rows : rows.filter(i => C[S.facet][i] === f);
  const dom = S.view === 'single' ? domainOf(rows, metric) : null;
  chart(card, fr, metric, sdims, cmap, dom, { small: false, key, H: Math.max(300, card.clientHeight - [...card.children].reduce((t, c) => t + c.offsetHeight, 0) - 40) });
}
addEventListener('keydown', e => { if (e.key === 'Escape' && S.expanded) { S.expanded = null; render(); } });

function domainOf(rows, metric) {
  let lo = Infinity, hi = -Infinity;
  for (const i of rows) { const y = C[metric][i]; if (y == null || (S.logY && !(y > 0))) continue;
    if (S.hidden.has(seriesKey(i, seriesDims()))) continue; lo = Math.min(lo, y); hi = Math.max(hi, y); }
  return isFinite(lo) ? [lo, hi] : null;
}

function render() {
  const rows = visibleRows(); const sdims = seriesDims(); const cmap = colorMap(rows, sdims);
  const box = $('charts'); box.innerHTML = '';
  // 범례 (시리즈 2개 이상일 때)
  const lg = $('legend'); lg.innerHTML = '';
  if (cmap.order.length > 1) for (const k of cmap.order.filter(k => cmap.color(k)).concat(cmap.folded.length ? ['__other'] : [])) {
    const it = document.createElement('div'); const isO = k === '__other';
    it.className = 'it' + (!isO && S.hidden.has(k) ? ' off' : '');
    const rank = cmap.order.indexOf(k) + 1, sv = isO ? null : cmap.score(k);
    it.innerHTML = (isO ? `<span class="sw" style="background:var(--other)"></span>` : swatch(cmap, k)) +
      esc(isO ? `기타 ${cmap.folded.length}개 (회색, 선에 마우스를 올리면 이름이 보임)` : `${cmap.order.length > 1 ? rank + '. ' : ''}${k}${sv != null ? ' · ' + fmt(sv) : ''}`);
    if (!isO) { it.dataset.s = rank - 1;
      it.onclick = () => { S.hidden.has(k) ? S.hidden.delete(k) : S.hidden.add(k); render(); };
      it.onmouseenter = () => setHL(rank - 1); it.onmouseleave = () => setHL(null); }
    lg.appendChild(it);
  }
  const msgs = [];
  if (cmap.order.length > 1) msgs.push(`색·범례 순서 = ${S.metric} 성능 순위(${higherBetter(S.metric) ? '높을수록' : '낮을수록'} 좋음; 각 시리즈의 마지막 ${xLabel(S.x)} 값${S.view === 'single' && S.facet ? ', ' + S.facet + ' 패싯 평균' : ''}).` +
    (cmap.order.length > MAXS ? ` 1~${MAXS}위 실선, ${MAXS + 1}~${MAXS * 2}위 같은 색 파선, ${MAXS * 2 + 1}~${MAXS * 3}위 점선` +
      (cmap.folded.length ? `, 나머지 ${cmap.folded.length}개는 회색 '기타'` : '') + '. 범례나 선에 마우스를 올리면 그 시리즈만 강조됩니다.' : ''));
  if (MODELONLY_OFF && !S.filters.pipeline.has('modelonly')) msgs.push('pipeline=modelonly 는 배포 평가 대상이 아니라 기본으로 제외했습니다 (필터: pipeline 에서 켤 수 있음).');
  if (!rows.length) msgs.push('필터에 맞는 행이 없습니다.');
  const cfgOn = D.eval_cfg.filter(d => S.filters[d].size < D.dim_values[d].length);
  if (cfgOn.length) msgs.push(`평가 설정 필터: ${cfgOn.map(d => [...S.filters[d]].map(v => v.includes('=') ? v : d + '=' + v).join(' / ')).join(', ')} (필터에서 바꿀 수 있음).`);
  msgs.push('범례 항목을 누르면 그 시리즈를 숨기거나 다시 보입니다.');
  $('notice').textContent = msgs.join(' ');

  if (S.view === 'single') {
    const facets = S.facet ? D.dim_values[S.facet].filter(v => S.filters[S.facet].has(v)) : [null];
    const dom = domainOf(rows, S.metric);
    box.style.gridTemplateColumns = facets.length > 1 ? 'repeat(auto-fit, minmax(min(100%, 520px), 1fr))' : '1fr';
    const todo = facets.map(f => {
      const card = document.createElement('div'); card.className = 'card'; box.appendChild(card);
      const key = cardHead(card, `${S.metric}${f != null ? ` — ${S.facet} = ${f}` : ''}`,
        (facets.length > 1 ? '패싯끼리 Y축 범위를 공유합니다 · ' : '') + '드래그로 확대, 더블클릭으로 원래대로', S.metric, f);
      return [card, f == null ? rows : rows.filter(i => C[S.facet][i] === f), key];
    });
    for (const [card, fr, key] of todo) chart(card, fr, S.metric, sdims, cmap, dom, { small: false, key });
  } else {
    const q = S.gridQuery.trim().toLowerCase();
    const ms = D.metrics.filter(m => m !== S.x && (!q || m.toLowerCase().includes(q)));
    box.style.gridTemplateColumns = 'repeat(auto-fill, minmax(min(100%, 340px), 1fr))';
    const todo = ms.map(m => { const card = document.createElement('div'); card.className = 'card';
      box.appendChild(card); return [card, m, cardHead(card, m, '', m, null)]; });
    for (const [card, m, key] of todo) chart(card, rows, m, sdims, cmap, null, { small: true, key });
  }
  drawOverlay(rows, sdims, cmap);
  renderTable(rows, sdims);
}

function renderTable(rows, sdims) {
  const t = $('tbl'); if (!t.open) { t.dataset.dirty = '1'; return; }
  const cols = [...(S.x === '__row' ? [] : [S.x]), ...D.dims, ...D.info,
    ...(S.view === 'single' ? [S.metric] : D.metrics.filter(m => m !== S.x))];
  const lim = rows.slice(0, 3000);
  $('tblwrap').innerHTML = `<table><thead><tr><th>#</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>` +
    lim.map(i => `<tr><td class="n">${i}</td>${cols.map(c => D.metrics.includes(c) ? `<td class="n">${fmt(C[c][i])}</td>` : `<td>${esc(C[c][i])}</td>`).join('')}</tr>`).join('') +
    `</tbody></table>` + (rows.length > lim.length ? `<p class="meta">앞 ${lim.length}행만 표시</p>` : '');
}
$('tbl').addEventListener('toggle', () => { if ($('tbl').open) renderTable(visibleRows(), seriesDims()); });

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
buildBar(); render();
</script>
</body>
</html>
