    const xv = x0 + (mx - M.l) / (W - M.l - M.r) * (x1 - x0);
    let best = uxs[0]; for (const u of uxs) if (Math.abs(u - xv) < Math.abs(best - xv)) best = u;
    const px = X(best); ch.setAttribute('x1', px); ch.setAttribute('x2', px); ch.setAttribute('visibility', 'visible');
    const hits = [];
    for (const k of ordered) for (const p of groups.get(k)) if (p[0] === best) hits.push([k, p]);
    hits.sort((p, q) => q[1][1] - p[1][1]);
    const my = (ev.clientY - r.top) * H / r.height;
    let near = null, nd = 24;   // 마우스 세로 위치에서 24px 안의 가장 가까운 선
    for (const [k, p] of hits) { const d = Math.abs(Y(p[1]) - my); if (d < nd) { nd = d; near = k; } }
    setHL(near == null ? null : cmap.rank(near));
    hl.innerHTML = hits.map(([k, p]) => `<circle cx="${px}" cy="${Y(p[1])}" r="${k === near ? 6 : 4.5}" fill="${cmap.color(k) || 'var(--other)'}" stroke="${surf}" stroke-width="2"/>`).join('');
    let show = hits.slice(0, 14);
    if (near != null && !show.some(([k]) => k === near)) show = show.slice(0, 13).concat(hits.filter(([k]) => k === near));
    let extra = '';
    if (hits.length === 1 && D.info.length) extra = D.info.map(c => `${esc(c)}: ${esc(C[c][hits[0][1][2]])}`).join('<br>');
    tip.innerHTML = `<div class="hd">${esc(xLabel(S.x))} = ${esc(xFmt(best))} · ${esc(metric)}</div>` +
      show.map(([k, p]) => `<div class="row${k === near ? ' hl' : ''}">${swatch(cmap, k)}${cmap.rank(k) + 1}. ${esc(k)}<b>${fmt(p[1])}</b></div>`).join('') +
      (hits.length > show.length ? `<div class="ex">외 ${hits.length - show.length}개</div>` : '') +
      (extra ? `<div class="ex">${extra}</div>` : '');
    tip.style.display = 'block';
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let lx = ev.clientX + 14, ly = ev.clientY + 14;
    if (lx + tw > innerWidth - 8) lx = ev.clientX - tw - 14; if (ly + th > innerHeight - 8) ly = innerHeight - th - 8;
    tip.style.left = lx + 'px'; tip.style.top = Math.max(8, ly) + 'px';
  });
  svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; ch.setAttribute('visibility', 'hidden'); hl.innerHTML = ''; setHL(null); });
}

let clipSeq = 0;
const zoomKey = (metric, f) => `${S.x}|${metric}|${f == null ? '' : S.facet + '=' + f}|${S.logY ? 'log' : 'lin'}`;

// 카드 머리: 제목 + (확대 중이면) 원래대로 + 크게 보기 버튼
function cardHead(card, title, sub, metric, f) {
  const key = zoomKey(metric, f);
  card.innerHTML = `<div class="hdr"><div><h3>${esc(title)}</h3>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div>` +
    (S.zoom[key] ? `<button class="ibtn" type="button" data-a="reset" title="확대 해제 (더블클릭과 같음)">↺ 원래대로</button>` : '') +
    `<button class="ibtn" type="button" data-a="big" title="크게 보기">⤢ 크게</button></div>`;
  card.querySelector('[data-a=big]').onclick = () => { S.expanded = { metric, f }; render(); };
  const rs = card.querySelector('[data-a=reset]'); if (rs) rs.onclick = () => { delete S.zoom[key]; render(); };
  return key;
}

// 크게 보기: 화면을 거의 채우는 창에 같은 그래프를 다시 그린다 (확대 상태는 작은 그래프와 공유)
function drawOverlay(rows, sdims, cmap) {
  document.querySelectorAll('.ovl').forEach(o => o.remove());
  if (!S.expanded) return;
  const { metric, f } = S.expanded;
  const ov = document.createElement('div'); ov.className = 'ovl';
  const card = document.createElement('div'); card.className = 'card'; ov.appendChild(card); document.body.appendChild(ov);
  const key = cardHead(card, `${metric}${f != null ? ` — ${S.facet} = ${f}` : ''}`,
    '드래그: 확대 (가로로만 끌면 X 범위, 상자로 끌면 X·Y) · 더블클릭: 원래대로 · Esc: 닫기', metric, f);
  const big = card.querySelector('[data-a=big]'); big.textContent = '✕ 닫기'; big.title = '닫기 (Esc)';
  big.onclick = () => { S.expanded = null; render(); };
  const lg = $('legend').cloneNode(true); lg.removeAttribute('id'); lg.querySelectorAll('.it').forEach(i => i.style.cursor = 'default');
  card.appendChild(lg);
  ov.onclick = e => { if (e.target === ov) { S.expanded = null; render(); } };
  const fr = f == null ? rows : rows.filter(i => C[S.facet][i] === f);
  const dom = S.view === 'single' ? domainOf(rows, metric) : null;
  chart(card, fr, metric, sdims, cmap, dom, { small: false, key, H: Math.max(300, card.clientHeight - [...card.children].reduce((t, c) => t + c.offsetHeight, 0) - 40) });
}
addEventListener('keydown', e => { if (e.key === 'Escape' && S.expanded) { S.expanded = null; render(); } });

function domainOf(rows, metric) {
  let lo = Infinity, hi = -Infinity;
  for (const i of rows) { const y = C[metric][i]; if (y == null || (S.logY && !(y > 0))) continue;
    if (S.hidden.has(seriesKey(i, seriesDims()))) continue; lo = Math.min(lo, y); hi = Math.max(hi, y); }
  return isFinite(lo) ? [lo, hi] : null;
}

function render() {
  const rows = visibleRows(); const sdims = seriesDims(); const cmap = colorMap(rows, sdims);
  const box = $('charts'); box.innerHTML = '';
  // 범례 (시리즈 2개 이상일 때)
  const lg = $('legend'); lg.innerHTML = '';
  if (cmap.order.length > 1) for (const k of cmap.order.filter(k => cmap.color(k)).concat(cmap.folded.length ? ['__other'] : [])) {
    const it = document.createElement('div'); const isO = k === '__other';
    it.className = 'it' + (!isO && S.hidden.has(k) ? ' off' : '');
    const rank = cmap.order.indexOf(k) + 1, sv = isO ? null : cmap.score(k);
    it.innerHTML = (isO ? `<span class="sw" style="background:var(--other)"></span>` : swatch(cmap, k)) +
      esc(isO ? `기타 ${cmap.folded.length}개 (회색, 선에 마우스를 올리면 이름이 보임)` : `${cmap.order.length > 1 ? rank + '. ' : ''}${k}${sv != null ? ' · ' + fmt(sv) : ''}`);
    if (!isO) { it.dataset.s = rank - 1;
      it.onclick = () => { S.hidden.has(k) ? S.hidden.delete(k) : S.hidden.add(k); render(); };
      it.onmouseenter = () => setHL(rank - 1); it.onmouseleave = () => setHL(null); }
    lg.appendChild(it);
  }
  const msgs = [];
  if (cmap.order.length > 1) msgs.push(`색·범례 순서 = ${S.metric} 성능 순위(${higherBetter(S.metric) ? '높을수록' : '낮을수록'} 좋음; 각 시리즈의 마지막 ${xLabel(S.x)} 값${S.view === 'single' && S.facet ? ', ' + S.facet + ' 패싯 평균' : ''}).` +
    (cmap.order.length > MAXS ? ` 1~${MAXS}위 실선, ${MAXS + 1}~${MAXS * 2}위 같은 색 파선, ${MAXS * 2 + 1}~${MAXS * 3}위 점선` +
      (cmap.folded.length ? `, 나머지 ${cmap.folded.length}개는 회색 '기타'` : '') + '. 범례나 선에 마우스를 올리면 그 시리즈만 강조됩니다.' : ''));
  if (MODELONLY_OFF && !S.filters.pipeline.has('modelonly')) msgs.push('pipeline=modelonly 는 배포 평가 대상이 아니라 기본으로 제외했습니다 (필터: pipeline 에서 켤 수 있음).');
  if (!rows.length) msgs.push('필터에 맞는 행이 없습니다.');
  const cfgOn = D.eval_cfg.filter(d => S.filters[d].size < D.dim_values[d].length);
  if (cfgOn.length) msgs.push(`평가 설정 필터: ${cfgOn.map(d => [...S.filters[d]].map(v => v.includes('=') ? v : d + '=' + v).join(' / ')).join(', ')} (필터에서 바꿀 수 있음).`);
  msgs.push('범례 항목을 누르면 그 시리즈를 숨기거나 다시 보입니다.');
  $('notice').textContent = msgs.join(' ');

  if (S.view === 'single') {
    const facets = S.facet ? D.dim_values[S.facet].filter(v => S.filters[S.facet].has(v)) : [null];
    const dom = domainOf(rows, S.metric);
    box.style.gridTemplateColumns = facets.length > 1 ? 'repeat(auto-fit, minmax(min(100%, 520px), 1fr))' : '1fr';
    const todo = facets.map(f => {
      const card = document.createElement('div'); card.className = 'card'; box.appendChild(card);
      const key = cardHead(card, `${S.metric}${f != null ? ` — ${S.facet} = ${f}` : ''}`,
        (facets.length > 1 ? '패싯끼리 Y축 범위를 공유합니다 · ' : '') + '드래그로 확대, 더블클릭으로 원래대로', S.metric, f);
      return [card, f == null ? rows : rows.filter(i => C[S.facet][i] === f), key];
    });
    for (const [card, fr, key] of todo) chart(card, fr, S.metric, sdims, cmap, dom, { small: false, key });
  } else {
    const q = S.gridQuery.trim().toLowerCase();
    const ms = D.metrics.filter(m => m !== S.x && (!q || m.toLowerCase().includes(q)));
    box.style.gridTemplateColumns = 'repeat(auto-fill, minmax(min(100%, 340px), 1fr))';
    const todo = ms.map(m => { const card = document.createElement('div'); card.className = 'card';
      box.appendChild(card); return [card, m, cardHead(card, m, '', m, null)]; });
    for (const [card, m, key] of todo) chart(card, rows, m, sdims, cmap, null, { small: true, key });
  }
  drawOverlay(rows, sdims, cmap);
  renderTable(rows, sdims);
}

function renderTable(rows, sdims) {
  const t = $('tbl'); if (!t.open) { t.dataset.dirty = '1'; return; }
  const cols = [...(S.x === '__row' ? [] : [S.x]), ...D.dims, ...D.info,
    ...(S.view === 'single' ? [S.metric] : D.metrics.filter(m => m !== S.x))];
  const lim = rows.slice(0, 3000);
  $('tblwrap').innerHTML = `<table><thead><tr><th>#</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>` +
    lim.map(i => `<tr><td class="n">${i}</td>${cols.map(c => D.metrics.includes(c) ? `<td class="n">${fmt(C[c][i])}</td>` : `<td>${esc(C[c][i])}</td>`).join('')}</tr>`).join('') +
    `</tbody></table>` + (rows.length > lim.length ? `<p class="meta">앞 ${lim.length}행만 표시</p>` : '');
}
$('tbl').addEventListener('toggle', () => { if ($('tbl').open) renderTable(visibleRows(), seriesDims()); });

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
buildBar(); render();
</script>
</body>
</html>
